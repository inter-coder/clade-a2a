[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clade-a2a"
version = "0.10.7"
description = "Agent-to-Agent (A2A) communication system for Claude Code instances — Bearer/HMAC-secured MCP relay with stdio peer agents"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    {name = "Dušan Krstić", email = "dusan.krstic@symappsys.com"},
]
keywords = ["claude", "mcp", "a2a", "agent", "relay"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Security",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "redis>=5.0",
    "jinja2>=3.1",     # v1.4.0: setup_server templates
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
clade-relay = "relay.main:main"
clade-agent = "agent.main:main"
clade-init = "clade_cli.init:main"
clade-setup-server = "clade_cli.setup_server:main"

[tool.hatch.build.targets.wheel]
packages = ["relay", "agent", "clade_cli"]
include = ["relay/ui/*.html", "clade_cli/templates/*"]

[tool.hatch.build.targets.wheel.force-include]
"relay/ui/audit.html" = "relay/ui/audit.html"

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
