<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clade A2A logo">
  <title>Clade A2A</title>
  <desc>Central spark (Claude tribute) with clade branches radiating to peripheral agent nodes.</desc>
  <defs>
    <radialGradient id="sparkGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4A88B"/>
      <stop offset="60%" stop-color="#DA7756"/>
      <stop offset="100%" stop-color="#A8482E"/>
    </radialGradient>
    <radialGradient id="nodeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E89A7B"/>
      <stop offset="100%" stop-color="#B45A3C"/>
    </radialGradient>
  </defs>

  <!-- Clade branches: organic curves from center spark out to peripheral nodes -->
  <g stroke="#CC785C" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.65">
    <path d="M 128 128 C 108 108, 70 70, 44 44"/>
    <path d="M 128 128 C 148 108, 186 70, 212 44"/>
    <path d="M 128 128 C 108 148, 70 186, 44 212"/>
    <path d="M 128 128 C 148 148, 186 186, 212 212"/>
    <path d="M 128 128 C 124 100, 128 60, 128 30"/>
    <path d="M 128 128 C 132 156, 128 196, 128 226"/>
  </g>

  <!-- Peripheral agent nodes -->
  <g fill="url(#nodeGrad)">
    <circle cx="44"  cy="44"  r="9"/>
    <circle cx="212" cy="44"  r="9"/>
    <circle cx="44"  cy="212" r="9"/>
    <circle cx="212" cy="212" r="9"/>
    <circle cx="128" cy="30"  r="9"/>
    <circle cx="128" cy="226" r="9"/>
  </g>

  <!-- Central spark: 4-pointed star (Claude tribute) -->
  <g fill="url(#sparkGrad)">
    <path d="
      M 128 72
      L 135 121
      L 184 128
      L 135 135
      L 128 184
      L 121 135
      L 72 128
      L 121 121
      Z
    "/>
  </g>

  <!-- Subtle center pulse (white highlight) -->
  <circle cx="128" cy="128" r="6" fill="#FFF5EE" opacity="0.7"/>
</svg>
